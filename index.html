'use strict';
const BASE_LESSONS = [{"day":1,"title":"起点诊断与目标设定","phase":"诊断","focus":"听说读写四技能","goal":"完成首次听力、阅读小测；录制60秒自述；写一封简短邮件，得到基线分数","vocab":["orientation 新生说明会","postpone 推迟","confirm 确认","deadline 截止日期","venue 会场","follow up 跟进"],"phrases":["I am writing to confirm…","The session has been moved to…","Please let me know if…"],"listening":"Hello everyone. This is a reminder about the international student orientation next Thursday. We originally planned to meet in Room 205, but that room is being repaired. The new venue is Lecture Hall B, on the second floor of the library building. Registration begins at 8:45 a.m., and the first presentation starts at 9:30. Please arrive early enough to collect your name badge. Student volunteers will help visitors find the correct entrance. If you have questions about accessibility or transport, email the student services team by Tuesday afternoon. We will send the final agenda to all registered participants on Wednesday.","lq":{"q":"Where will the orientation take place?","options":["Room 205","Lecture Hall B","The dining hall"],"answer":1},"reading":"A university service team is planning a welcome event for overseas students. The team has a modest budget and only one week to prepare. A successful event should provide accurate practical information, but it should also help students feel comfortable asking questions. The organizers have considered a long formal presentation, a series of information stations, and a guided campus walk. The presentation is efficient, although some students may feel overwhelmed by too much information. Stations allow participants to speak with relevant staff, but they require more volunteers. A campus walk is engaging, although poor weather could disrupt it. The team decides to use a short opening talk followed by information stations. They also prepare an indoor route as a backup. Participants will receive a digital handbook after the event, rather than a large printed package. The organizers believe this format balances clarity, interaction, and practical constraints.","rq":{"q":"Why did the team choose information stations?","options":["They require no staff","They allow direct questions","They are always cheaper than a talk"],"answer":1},"speak":"You are a university administrative assistant. Introduce yourself and explain two responsibilities in 60 seconds.","write":"Write an email (100–150 words) confirming a change of venue and giving practical instructions to participants.","tips":"首日不追求高分。先独立完成，写下最明显的3个困难。","mode":"诊断"},{"day":2,"title":"职场基础表达与时间信息","phase":"基础","focus":"预约、日期、截止时间、协调","goal":"掌握日期与时间表达，避免 by / before / until 混用","vocab":["appointment 预约","available 有空的","by Friday 最迟周五","before noon 中午之前","until five 一直到五点","reschedule 重新安排"],"phrases":["Could we move the meeting to…?","Please submit the form by Friday.","The office will remain open until 5 p.m."],"listening":"Good morning, Mia. I am calling about the training workshop scheduled for Friday. The speaker has a flight delay and cannot arrive before ten. Could we move the opening session from 9:00 to 10:30? The workshop still needs to finish by 4:00 p.m. because the building closes at 4:30. Please contact the participants before noon tomorrow and confirm the revised schedule with the catering team by Thursday. We have already booked the room, so there is no need to change the venue. I will email you the new agenda in an hour. Thank you for helping us adjust the arrangements.","lq":{"q":"What must be confirmed by Thursday?","options":["The catering arrangement","The building renovation","A new venue"],"answer":0},"reading":"In professional communication, a precise deadline prevents unnecessary follow-up messages. The phrase “by Friday” usually means no later than Friday, while “before Friday” excludes Friday itself in ordinary usage. “Until Friday” describes how long a state or activity continues. Confusing these expressions can create practical problems. For example, an applicant who sends a document on Friday may meet a “by Friday” deadline but miss a “before Friday” requirement. There may be additional time-zone or submission-system rules, so important instructions should include a date and time, such as “by 5 p.m. Beijing time on 12 March.” When a schedule changes, a good message should explain what has changed, what remains unchanged, and what the recipient must do next. This is often clearer than a long apology.","rq":{"q":"Which sentence has the clearest deadline?","options":["Send it soon","Send it until Friday","Submit it by 5 p.m. Beijing time on 12 March"],"answer":2},"speak":"Tell a colleague the workshop has been delayed. Explain the new start time and two deadlines.","write":"Write a concise schedule-change email using “by”, “before”, and “until” correctly.","tips":"把日期、房间号、截止时间单独记在笔记区；听第二遍时核对。","mode":"基础"},{"day":3,"title":"解说数据①：读懂数字","phase":"口头沟通","focus":"解说数据 / 图表口答","goal":"90秒读取数据，15秒内准确回答数字与比较问题","vocab":["figure 数字","increase 上升","decrease 下降","highest 最高","lowest 最低","approximately 大约"],"phrases":["The highest figure is…","It increased from … to …","The number fell by…"],"listening":"The administration team reviewed participation in three short courses. In spring, 120 people joined the communication course, 80 joined the data course, and 60 joined the project management course. In autumn, communication attracted 150 people, data attracted 140, and project management attracted 90. The data course showed the largest increase in absolute numbers, rising by sixty participants. The team plans to add one extra data class next semester. Although communication still has the highest enrollment, its growth was more moderate. Managers will use these figures to decide how many classrooms and instructors to reserve.","lq":{"q":"Which course had the largest increase?","options":["Communication","Data","Project management"],"answer":1},"reading":"The table below summarizes course enrollment across two terms.\n\nCommunication: Spring 120 | Autumn 150\nData skills: Spring 80 | Autumn 140\nProject management: Spring 60 | Autumn 90\n\nWhen reading a chart, first identify the title, time period, unit, and category labels. Then identify the highest and lowest values, changes, and possible exceptions. An increase of 60 from a baseline of 80 is a 75% increase, while an increase of 30 from 120 is only 25%. If a question asks for the biggest change, check whether it means the number of people or the percentage change. Avoid adding an explanation that the data cannot support. Enrollment numbers show demand for a course, but they do not prove that the course is better or that teaching quality has improved.","rq":{"q":"What is the percentage increase in data-course enrollment?","options":["25%","50%","75%"],"answer":2},"speak":"Use the data table to answer: Which course was most popular in autumn? Which increased by 60? Give concise answers.","write":"Write an 80–120-word factual description of the enrollment table without claiming unsupported causes.","tips":"先答数字，再考虑完整句。数字准确和听清比较级比华丽句型重要。","mode":"口头-数据"},{"day":4,"title":"解说数据②：趋势与对比","phase":"口头沟通","focus":"趋势、峰值、百分比","goal":"能够区分绝对增量与增幅，减少数词口误","vocab":["peak 峰值","steady 稳定的","fluctuate 波动","double 翻倍","account for 占比","compared with 与…相比"],"phrases":["The figure peaked in…","It remained stable at…","Compared with last year, …"],"listening":"The library recorded visitor numbers for four months: January, two thousand; February, twenty-two hundred; March, twenty-one hundred; and April, twenty-six hundred. Visits were fairly stable during the first three months, before reaching a peak in April. The number in April was six hundred higher than in January. The library introduced an online booking system in March, but managers have not established whether the system caused the increase. They will compare visitor patterns over a longer period before drawing conclusions.","lq":{"q":"In which month did visits peak?","options":["February","March","April"],"answer":2},"reading":"Consider monthly library visits: January 2,000; February 2,200; March 2,100; April 2,600. To explain this data professionally, state the overall pattern first: visits increased across the period, although there was a small dip in March. Next, report important numbers. April recorded the most visits, while January recorded the fewest. Finally, give the size of the change. The April figure was 30 percent higher than January's because the difference of 600 is 30 percent of 2,000. A common mistake is to say that numbers increased “by 130 percent” when the final value is actually 130 percent of the original. In exam tasks, focus on exactly what the question asks and use the correct unit.","rq":{"q":"How much higher was April than January?","options":["20%","30%","60%"],"answer":1},"speak":"Give five brief answers: January visits, April visits, peak month, change from January, overall trend.","write":"Summarize the table in 100 words. State which claim about the booking system is not yet supported.","tips":"口答允许简短；完整而错误的复杂句不如准确的短句。","mode":"口头-数据"},{"day":5,"title":"回复留言①：抓住三要点","phase":"口头沟通","focus":"听取留言，识别要求并回复","goal":"一分钟内按三要点回复，语气自然、信息完整","vocab":["voicemail 语音留言","attachment 附件","confirm attendance 确认出席","arrangement 安排","available slot 空档","in advance 提前"],"phrases":["Thank you for your message.","I can confirm that…","Could you please send…?"],"listening":"Hi Alex, this is Jane from the international office. I'm calling about the visiting scholars' workshop next week. We have received twelve registrations, but two participants have not confirmed whether they need accommodation. Could you contact them by Thursday? Also, the guest speaker needs a projector with an HDMI connection. Please ask the technical team to test the equipment on Monday morning. Finally, we would like to print name badges, but the participant list may still change. I suggest waiting until Friday afternoon before printing the final batch. Give me a call if any arrangement is likely to be delayed. Thanks for your help.","lq":{"q":"When should the badges be printed?","options":["Monday morning","Thursday morning","Friday afternoon"],"answer":2},"reading":"A successful response to a workplace voicemail has a predictable structure. Begin by acknowledging the message and showing that you understand the main purpose. Next, respond directly to each requested action. If you can complete a task, make a clear commitment, including a date if appropriate. If you need clarification, ask one specific question instead of saying only “I need more information.” End politely and confirm when the other person can expect an update. Do not invent decisions that require another colleague's approval. The speaker may give background details that are not part of your required response; use the task instructions to decide what matters most.","rq":{"q":"What should you do when approval is still needed?","options":["Promise immediate delivery","Say it is already approved","Clearly state that confirmation is pending"],"answer":2},"speak":"Reply to Jane in 60 seconds: accommodation follow-up, projector testing, badge printing.","write":"Write a short follow-up email to Jane listing the same three actions and deadlines.","tips":"听完先写下 ①谁 ②做什么 ③何时；准备阶段按三点排序。","mode":"口头-留言"},{"day":6,"title":"回复留言②：确认与建议","phase":"口头沟通","focus":"条件限制、提出替代方案","goal":"完成本周首次听说阶段复盘与60秒留言回复","vocab":["alternative 备选方案","capacity 容量","accessible 无障碍可达","overlap 时间冲突","reserve 预订","tentative 暂定"],"phrases":["One possible alternative is…","Would it be possible to…?","I will confirm this by…"],"listening":"Hello, this is David from the events office. We booked Conference Room C for the faculty seminar, but the facilities team has just informed us that its air-conditioning will be repaired on Tuesday. We need another room for about forty people. Room D is available, although it has only thirty seats. The main lecture theatre has enough space, but it will not be free until 2:00 p.m. The seminar is currently scheduled for 1:30. Please suggest a practical solution, tell me how you would inform the speakers, and let me know when you can confirm the new arrangement.","lq":{"q":"What is the problem with Room D?","options":["It has no projector","It has only thirty seats","It is under repair"],"answer":1},"reading":"When proposing a solution at work, begin with the facts and constraints. A reasonable suggestion should address the key need without ignoring important details. If an event requires forty seats, a thirty-seat room is not an appropriate choice unless attendance can be reduced. A larger room that becomes available later may solve the problem if the schedule can shift. Good communication acknowledges the trade-off: changing the start time affects guests and speakers, so they must be informed quickly. A polite proposal may use “I suggest moving…” followed by a clear reason and a confirmation deadline. An effective response does not pretend that inconvenient constraints have disappeared.","rq":{"q":"What is the most practical solution described?","options":["Keep Room C without checking","Use Room D for forty guests","Move the seminar to 2 p.m. in the lecture theatre, subject to confirmation"],"answer":2},"speak":"Give a 60-second reply suggesting a feasible room and explaining the communication plan.","write":"Prepare a 120-word revised invitation with the new time and room, subject to final confirmation.","tips":"本周测：口语信息覆盖/5、语言表达/5；同时保留上周录音对比。","mode":"口头-留言"},{"day":7,"title":"报告信息①：笔记与复述","phase":"口头沟通","focus":"听200词左右信息，90秒整理并复述","goal":"抓住主题、3个支点和结论，完成结构化复述","vocab":["initiative 新措施","implementation 实施","benefit 好处","challenge 挑战","monitor 监测","recommendation 建议"],"phrases":["The speaker focused on three points.","First, …","The main recommendation was…"],"listening":"Today's briefing is about reducing energy use in university buildings. The facilities team identified three practical actions. First, classroom lights should be turned off when rooms are empty. Motion sensors may help in high-traffic areas, but they are expensive to install everywhere. Second, air-conditioning temperatures can be adjusted slightly during moderate weather, while laboratories must maintain their required conditions. Third, staff should receive a short monthly report showing energy consumption by building. The briefing emphasized that individual habits matter, but building design and equipment maintenance are also important. A three-month trial will begin in two teaching buildings, and the team will compare electricity consumption with the same period last year. The speaker recommended starting with low-cost changes, collecting reliable data, and expanding the program only after evaluating the results.","lq":{"q":"How long will the trial last?","options":["One month","Three months","One year"],"answer":1},"reading":"Good note-taking is selective rather than exhaustive. In an information-reporting task, the speaker may provide examples, explanations, and background details. Your job is to identify the central message and organize supporting points so another person can understand them quickly. One useful structure is “topic — three actions — caution — next step.” Use keywords and symbols in your notes rather than trying to transcribe complete sentences. During preparation, group related points together and decide which details are essential. Your report should not include your personal opinion unless the task explicitly asks for it. Accuracy and clarity matter more than repeating the speaker's original wording.","rq":{"q":"Which note structure is recommended?","options":["Topic—actions—caution—next step","Every word in order","Personal reaction first"],"answer":0},"speak":"Give a 90-second briefing to your manager summarizing the three energy-saving actions and the trial.","write":"Write a 140-word report summarizing the briefing and its recommendation.","tips":"第一次播放只抓结构，第二遍补充限制条件和数字。","mode":"口头-报告"},{"day":8,"title":"报告信息②：信息准确与复述","phase":"口头沟通","focus":"区分事实、建议、限制","goal":"减少遗漏、误归因与顺序混乱","vocab":["pilot program 试点","feedback 反馈","accessibility 无障碍","eligible 符合资格的","roll out 推广","evaluate 评估"],"phrases":["The purpose of the pilot is…","However, the speaker warned that…","The next step is to…"],"listening":"The student services center is testing a new online appointment system. During the first month, students can book appointments for visa guidance and document support, but emergency requests will still be handled by telephone. The team chose these two services because demand is predictable and staff can prepare relevant information before each meeting. Early feedback has been positive, particularly from students who live far from campus. However, some students have difficulty accessing the platform on older phones. The center will keep an in-person booking desk during the trial and will provide a simple illustrated guide. After eight weeks, the team will examine waiting times, missed appointments, and student feedback before deciding whether to extend the system to other services.","lq":{"q":"Which requests are still handled by telephone?","options":["All visa questions","Emergency requests","Routine document appointments"],"answer":1},"reading":"A strong verbal report preserves both what the speaker recommends and what the speaker does not recommend. If a trial includes only two service categories, do not describe it as a campus-wide launch. If early feedback is encouraging but the data are incomplete, do not say the new system is proven successful. The listener should be able to distinguish goals, evidence, risks, and planned evaluation. In professional settings, this distinction prevents decisions based on exaggeration. A practical note template uses four headings: purpose, implementation, limitations, and follow-up. The conclusion should make clear what will happen next and when the decision will be made.","rq":{"q":"Which statement is justified?","options":["The new system has been fully rolled out","The trial has two service categories and will be evaluated","All students prefer online booking"],"answer":1},"speak":"Report the pilot to a colleague in 90 seconds, including a risk and the eight-week decision.","write":"Write a 150-word summary distinguishing early feedback from proven results.","tips":"特别核对限定词：some、only、after、may、during。","mode":"口头-报告"},{"day":9,"title":"专题发言①：一分钟有结构","phase":"口头沟通","focus":"职场活动介绍、明确受众","goal":"90秒准备，60秒完成有开头有结尾的发言","vocab":["purpose 目的","participant 参与者","engaging 有吸引力的","encourage 鼓励","benefit 受益","sign up 报名"],"phrases":["I would like to introduce…","There are two reasons to join.","We look forward to seeing you."],"listening":"The community education center is organizing a weekend cultural exchange program. Participants can learn simple calligraphy techniques, try traditional paper-cutting, and take part in a discussion about local customs. The program is free, but places are limited to thirty people to ensure that everyone can participate in the hands-on activities. Volunteers who speak English will be available to answer questions. The organizers hope that international residents will feel more connected to the neighborhood. Registration closes on Wednesday, and participants should arrive ten minutes early. The event is open to beginners, and no special equipment is required.","lq":{"q":"How many places are available?","options":["20","30","50"],"answer":1},"reading":"An effective one-minute speech is not a list of unrelated facts. It identifies the audience, explains the purpose, gives two or three useful details, and finishes with a clear invitation or recommendation. If the audience is unfamiliar with local traditions, explain terms simply instead of using complicated cultural references. A useful time allocation is about ten seconds for the opening, forty seconds for the main message, and ten seconds for the closing. Short sentences help speakers stay within time. When you prepare, write three keywords rather than memorizing a full paragraph. This gives you room to speak naturally while keeping your message organized.","rq":{"q":"What is the recommended structure?","options":["Long introduction only","Purpose, details, clear closing","Memorized technical definitions"],"answer":1},"speak":"Invite international residents to join a local cultural exchange program in 60 seconds.","write":"Draft a 140-word event introduction suitable for a bilingual university newsletter.","tips":"先保证信息完整：活动是什么、为什么参加、如何参加。","mode":"口头-发言"},{"day":10,"title":"专题发言②：说服与中期测评","phase":"口头沟通","focus":"听众意识、利益表达","goal":"完成阶段口语测评：60秒完整发言与自评","vocab":["persuade 说服","practical value 实用价值","inclusive 包容的","opportunity 机会","develop skills 培养技能","contribute 贡献"],"phrases":["This initiative offers three benefits.","You will have the opportunity to…","I encourage you to…"],"listening":"Our university plans to recruit volunteers for the international research forum. Volunteers will guide visitors, distribute program information, and assist speakers with basic arrangements. Students do not need previous event experience, because the organizing committee will offer a two-hour training session. However, volunteers should be able to communicate clearly in English and follow instructions from team leaders. The program provides a useful opportunity to practice teamwork and professional communication. The forum takes place over two days in early December. Interested students must complete an online form by the end of next week.","lq":{"q":"What is provided to volunteers?","options":["Free overseas travel","A two-hour training session","Automatic employment"],"answer":1},"reading":"Persuasive speaking should be audience-centered. Instead of only stating what an organizer needs, explain what participation offers the audience. A student may care about professional experience, confidence, and opportunities to work with people from different backgrounds. A convincing speech combines concrete information with a realistic benefit. Avoid promising rewards that have not been confirmed. Effective transitions include “First,” “Another benefit,” and “Finally,” but it is not necessary to use a transition in every sentence. Practice with a timer and listen to the recording. If the ending is cut off, shorten the opening rather than speaking much faster.","rq":{"q":"What makes the invitation persuasive?","options":["Unverified promises","Benefits connected to the audience","As many difficult words as possible"],"answer":1},"speak":"Recruit student volunteers for the international forum; explain duties, training, and why it is worthwhile.","write":"Write a 150-word volunteer recruitment notice with clear eligibility and application instructions.","tips":"D10中期节点：比较D1录音与今天录音，记录准确性和流利度变化。","mode":"阶段测评"},{"day":11,"title":"会议纪要①：听信息填空","phase":"书面沟通","focus":"会议结论、负责人、期限","goal":"识别数字与行动人，写出简洁会议纪要","vocab":["agenda 议程","minutes 会议纪要","action item 待办事项","responsible for 负责","due date 到期日","approve 批准"],"phrases":["It was agreed that…","The team assigned … to…","The deadline is…"],"listening":"Let's begin the planning meeting for the academic open day. First, the date is confirmed as Friday, 16 April, and the event will begin at 10 a.m. Olivia will finalize the guest list by Monday. James is responsible for checking classroom capacity and accessibility by Wednesday. The communications team will prepare a short bilingual announcement and send it for approval on Tuesday. We have agreed not to print the program until the final list of speakers is confirmed. Please send any outstanding questions to me before 5 p.m. tomorrow. Our next planning meeting will take place online next Thursday.","lq":{"q":"Who will check the classroom capacity?","options":["Olivia","James","The communications team"],"answer":1},"reading":"Meeting minutes are not a verbatim transcript. A useful record includes the meeting purpose, key decisions, action items, responsible people, and deadlines. Avoid recording casual remarks unless they explain a decision. For example, if the team decides to delay printing until speakers are confirmed, the minutes should preserve that condition. In a listening task, one speaker may suggest an option that the group does not ultimately accept. The final decision is more important than the abandoned suggestion. Use concise phrases and check spelling carefully, especially names, dates, and numbers. A good record allows someone who missed the meeting to understand what to do next.","rq":{"q":"Which information is essential in minutes?","options":["Every spoken filler word","Decisions, owners and deadlines","Only the meeting title"],"answer":1},"speak":"Brief a colleague on three action items from the meeting in under 60 seconds.","write":"Create a meeting-minutes table: decision, owner, due date, outstanding question.","tips":"不要把讨论中的“建议”写成“最终决定”。","mode":"书面-纪要"},{"day":12,"title":"会议纪要②：速记与同义改写","phase":"书面沟通","focus":"笔记缩写、跟踪行动项","goal":"听懂相同信息的不同表达，并准确填写纪要","vocab":["coordinate 协调","pending 待定","procurement 采购","inspection 检查","update 进度更新","contingency 备选计划"],"phrases":["This item is still pending.","We need an update by…","A backup option is available."],"listening":"We have three updates on the library renovation. The procurement office says that the new desks should arrive by 12 May. Delivery was originally expected on 8 May, so the schedule has moved back by four days. Next, the safety team will inspect the reading area on 14 May. We cannot reopen the area until the inspection is approved. Finally, the IT department will install the new booking terminals after the desks have been delivered. Maria will coordinate with the suppliers and provide a status report each Friday. If the furniture is delayed again, we will temporarily use the smaller reading room on the ground floor.","lq":{"q":"What must happen before the reading area reopens?","options":["The safety inspection must be approved","The status report must be printed","The second-floor café must reopen"],"answer":0},"reading":"In a workplace meeting, speakers often reformulate the same instruction: “send me an update,” “keep me informed,” and “provide a progress report” can refer to related communication tasks. The ability to recognize paraphrase is useful in listening tests, but you must still preserve specific commitments. If a delivery date changes from 8 May to 12 May, the new date should appear in the final minutes. Conditions also matter: equipment installation may depend on furniture delivery, and reopening may depend on an inspection. A useful shorthand system includes “→” for leads to, “?” for pending questions, and “DL” for deadlines. Keep your shorthand consistent so you can read it during the exam.","rq":{"q":"What is the revised desk-delivery date?","options":["8 May","12 May","14 May"],"answer":1},"speak":"Give a one-minute spoken update explaining the sequence of delivery, installation, and inspection.","write":"Write the five most important meeting minutes and mark the conditional reopening decision.","tips":"听两遍时先写缩写，再补语法；数字必须复查。","mode":"书面-纪要"},{"day":13,"title":"研判材料①：读懂论点与证据","phase":"书面沟通","focus":"约500词文章的分析阅读","goal":"识别主旨、论证关系、证据类型与作者立场","vocab":["claim 主张","evidence 证据","assumption 假设","counterargument 反方论点","reliable 可靠的","conclusion 结论"],"phrases":["The author argues that…","The evidence suggests…","A limitation of the study is…"],"listening":"Universities are increasingly using digital tools to support students outside classroom hours. These tools may include appointment booking, self-service document requests, automated reminders, and knowledge bases for frequently asked questions. Supporters argue that digital services reduce routine administrative work. Students can check a deadline at midnight without waiting for office hours, and staff can spend more time handling complicated cases.\n\nHowever, efficiency is not the same as effectiveness. A faster response does not guarantee that a student receives accurate advice. Automated systems may misunderstand unusual questions, while some users may have difficulty accessing online services. If universities remove every in-person channel, they risk excluding students who have limited internet access or need more personal support.\n\nOne approach is a blended system. Routine questions are handled by reliable self-service tools, and complex or sensitive cases are directed to trained staff. Institutions should monitor not only the number of online requests completed, but also error rates, response quality, and student satisfaction. They should also provide clear instructions and make sure students know when to contact a human advisor.\n\nThe strongest argument for digitization is therefore not that machines should replace staff. It is that good tools can help staff provide better service. A university that introduces technology without clear responsibilities or evaluation may create new problems even if the system appears modern. Successful implementation depends on service design, accurate information, accessible alternatives, and continuous improvement.","lq":{"q":"What is the speaker’s preferred approach?","options":["Replace all staff immediately","Combine self-service tools with human support","Stop all digital services"],"answer":1},"reading":"Analytical reading requires more than recognizing vocabulary. A typical argument has a claim, reasons, evidence, qualifications, and a conclusion. The claim states what the writer wants readers to accept. Evidence supports the claim but may be limited in scope. A qualification explains when the argument may not apply. Compare the following statements: “Students completed online requests more quickly” and “Online services improved student wellbeing.” The first may be supported by service data; the second requires different evidence.\n\nWhen a text presents advantages followed by limitations, do not assume the author rejects the innovation. Often the final position is conditional: the system is useful if particular safeguards are provided. Look for linking expressions such as “however,” “therefore,” and “provided that.” In an exam, read the question before locating the relevant paragraph, but confirm your answer by checking the surrounding sentences rather than matching a single word.","rq":{"q":"Which claim needs additional evidence?","options":["Average processing time fell","The new system improved students’ wellbeing","The service processed 300 forms"],"answer":1},"speak":"Explain the author’s position on digital services and one limitation in 60–90 seconds.","write":"Write an evidence-based paragraph: Should universities replace face-to-face student service desks?","tips":"阅读题不要凭现实经验代替原文证据。","mode":"书面-阅读"},{"day":14,"title":"研判材料②：比较与推断","phase":"书面沟通","focus":"事实/观点/推断、反例","goal":"在限定时间内判断证据是否足以支持结论","vocab":["interpret 解释","infer 推断","biased 有偏的","representative 有代表性的","survey 调查","trade-off 取舍"],"phrases":["The survey indicates…","It would be premature to conclude…","On the other hand, …"],"listening":"A university surveyed 240 students about the option of attending some administrative appointments online. Sixty percent preferred a combination of online and in-person services; twenty-five percent preferred in-person appointments; and fifteen percent preferred online-only services. On the surface, these figures suggest broad support for a flexible arrangement.\n\nYet the survey had limitations. It was distributed primarily through the university's digital learning platform, which means students who rarely use that platform may have been underrepresented. The survey also asked about preferences rather than observing how students actually behaved. A student who prefers online appointments may still choose to visit the office in person when dealing with a complicated problem.\n\nThe administration team considered a pilot rather than a permanent policy change. It planned to offer online appointments for routine document checks, while keeping face-to-face assistance for exceptional situations. The team would track waiting times, missed appointments, accessibility complaints, and satisfaction over one semester. Staff training would include how to recognize when an online request needed to be transferred to another service.\n\nThis approach is slower than an immediate full launch, but it allows decision-makers to test assumptions. The main lesson is that a promising survey result can guide a policy experiment without being treated as complete proof. Good analysis makes room for both potential benefits and uncertainties.","lq":{"q":"What percentage preferred a combination of online and in-person services?","options":["15%","25%","60%"],"answer":2},"reading":"When evaluating a survey, ask who participated, how the sample was selected, what exactly was measured, and whether alternative explanations are plausible. A survey of digital-platform users may not represent students with poor digital access. Preferences also differ from measured behavior. The percentage of respondents who say they like an idea does not prove that they will use it frequently. This does not make all survey findings useless. The findings can support a carefully designed pilot, especially when decision-makers measure actual outcomes afterward. In written analysis, distinguish the wording “suggests” from “proves.” The former acknowledges uncertainty; the latter requires stronger evidence. A careful reader will also look for recommendations that are proportional to the strength of the evidence.","rq":{"q":"Why could the survey be unrepresentative?","options":["Only digital-platform users were strongly reached","It was printed on paper","It included everyone on campus"],"answer":0},"speak":"Give a one-minute explanation of why a pilot is better than an immediate full policy change.","write":"Write a 160-word evaluation of the survey, mentioning two limitations and one practical recommendation.","tips":"把作者“有条件支持”与“完全反对”区分开。","mode":"书面-阅读"},{"day":15,"title":"撰写提要①：提取关键信息","phase":"书面沟通","focus":"阅读后概括约150词","goal":"只总结来源信息，不加入个人观点","vocab":["summarize 概括","central idea 核心观点","supporting point 支撑点","paraphrase 改写","objective 客观的","concise 简明的"],"phrases":["The article discusses…","It identifies three challenges.","The author concludes that…"],"listening":"Food waste is a persistent challenge in large university cafeterias. It has financial and environmental costs, but eliminating it completely is unrealistic. Cafeteria managers often face uncertainty about the number of customers, particularly during examinations, holidays, and sudden weather changes. Preparing too little food can lead to long queues and dissatisfied students, while preparing too much creates avoidable waste.\n\nSome institutions have introduced pre-ordering systems to estimate demand. Others adjust portion sizes, provide clearer menu information, and monitor which dishes are frequently left unfinished. A useful practice is to measure waste separately at preparation, serving, and plate-return stages, because each category may have different causes. For instance, vegetable trimmings created during preparation should not be confused with uneaten portions left by diners.\n\nTechnology can support better planning, but human judgment remains necessary. Forecasts based on previous sales may be less accurate during unusual campus events. Staff need to interpret the data and communicate with students. An effective program should also avoid unfairly blaming individual diners when menu design or serving practices contribute to waste.\n\nExperts recommend that universities begin with a baseline measurement, test one or two changes, and compare outcomes over several weeks. Improvements should be evaluated using both total waste and service quality. A cafeteria that reduces food waste but regularly runs out of meals has not necessarily solved the problem. The overall goal is a service that is reliable, affordable, and less wasteful.","lq":{"q":"Which stage is NOT listed as a waste-measurement category?","options":["Preparation","Serving","Recruitment"],"answer":2},"reading":"A summary should preserve the source's central argument and major supporting ideas, but not every example. Before writing, underline the thesis statement and mark two or three structural points. Group overlapping examples under a broader label. Then draft with your own sentences instead of copying whole passages. Avoid phrases such as “I agree” or “this is an excellent idea” unless the assignment explicitly requests an evaluation. A strong summary usually starts by identifying the topic and author's central position, then covers the main reasons and the conclusion. After writing, check for distortions: did you turn a tentative suggestion into a firm fact, leave out a major limitation, or overemphasize a minor example? Accuracy is more important than decorative vocabulary.","rq":{"q":"Which sentence belongs in an objective summary?","options":["I personally love this idea","The author recommends measuring waste before changing practices","Students are clearly irresponsible"],"answer":1},"speak":"Explain the article’s main recommendation and two supporting points orally in 75 seconds.","write":"Summarize the food-waste passage in approximately 150 English words; no personal opinion.","tips":"先提纲再写：问题—措施—限制—结论。","mode":"书面-提要"},{"day":16,"title":"撰写提要②：压缩与改写","phase":"书面沟通","focus":"避免抄写、控制字数","goal":"产出结构连贯、信息准确的约150词提要","vocab":["coherent 连贯的","omit 省略","retain 保留","overgeneralize 过度概括","neutral 中立的","source text 原文"],"phrases":["The passage highlights…","A key concern is…","In conclusion, …"],"listening":"Adults who return to education often bring practical knowledge, strong motivation, and clear goals. However, they may face barriers that are different from those experienced by full-time students. Many must balance work, family responsibilities, and study. Some have not taken a formal examination for years and may feel uncertain about academic expectations.\n\nFlexible learning programs can reduce these barriers through evening classes, recorded lectures, accessible learning materials, and clear administrative guidance. Yet flexibility alone is not sufficient. A program with no deadlines or feedback may leave participants isolated and unsure of their progress. Adult learners often benefit from structured milestones, relevant exercises, and prompt explanations of errors.\n\nInstitutions should also consider how participants apply new skills. A course may be more useful when assignments draw on real workplace tasks. For example, learners studying English for administration could practice scheduling meetings, summarizing information, and writing professional emails. Peer discussion can help them compare approaches, while teacher feedback prevents repeated mistakes from becoming habits.\n\nProgram evaluation should examine completion rates, skill improvement, and learner satisfaction rather than relying only on registrations. The article's main message is that effective adult education combines flexible access with clear structure, practice, and targeted feedback.","lq":{"q":"What combination does the article recommend?","options":["Flexibility without feedback","Rigid schedules only","Flexible access plus structure and feedback"],"answer":2},"reading":"Paraphrasing means expressing the same meaning in a new form, not simply replacing each word with a synonym. For example, “Students often struggle to combine family duties with study” can become “Balancing education and family responsibilities is a common challenge.” The meaning remains, but the sentence structure changes. Be careful not to remove important qualifications while shortening. A passage that says “some participants may feel isolated” should not become “all participants are isolated.” Useful editing steps are to remove repeated examples, combine similar points, and check that each sentence contributes to the central argument. Count words only after you have checked the content, because a short but misleading summary is not a strong answer.","rq":{"q":"What is a valid paraphrase?","options":["Replacing words while changing the meaning","Restating the same idea with a different structure","Copying each sentence exactly"],"answer":1},"speak":"Give a short oral explanation: What do adult learners need besides flexible scheduling?","write":"Write a roughly 150-word neutral summary of the adult-learning article, then revise it for concision.","tips":"自查4项：主旨、要点、逻辑、字数。","mode":"书面-提要"},{"day":17,"title":"撰写邮件①：情境与礼貌","phase":"书面沟通","focus":"回复来信、覆盖任务要点","goal":"写出完整、得体、条理清晰的150词左右邮件","vocab":["inquiry 询问","itinerary 行程","accommodation 住宿","arrange 安排","clarify 澄清","appreciate 感谢"],"phrases":["Thank you for your inquiry.","We would be pleased to…","Could you clarify whether…?"],"listening":"Dear Events Team, Thank you for inviting our research group to visit your university next month. We are interested in meeting faculty members and seeing the new laboratory facilities. We expect to bring six colleagues, although the final number may change. Could you tell us whether the visit can take place on Thursday morning? We would also appreciate advice on travel from the railway station and nearby accommodation. Finally, please let us know if we need to provide any documents before arrival. I look forward to your response. Best regards, Dr. Miller.","lq":{"q":"How many colleagues does the visitor currently expect to bring?","options":["Four","Six","Ten"],"answer":1},"reading":"A reply email should respond to the sender's actual needs. First identify the relationship and purpose: is the sender a visitor, supervisor, client, or colleague? Then list every required point before writing. A clear reply begins by acknowledging the message, moves to the requested information, and ends with the next action. If details are not yet confirmed, state that accurately and give a realistic time for an update. Use paragraphs to separate topics. Excessively formal language may sound unnatural, while casual abbreviations may be inappropriate for an external visitor. The strongest email is not necessarily the longest; it is the one that allows the recipient to act without sending several additional questions.","rq":{"q":"What should a good reply do when information is pending?","options":["Invent a final answer","Explain what is pending and when an update is expected","Ignore that question"],"answer":1},"speak":"Leave a 60-second voice reply confirming the proposed visit and explaining pending details.","write":"Reply to Dr. Miller (about 150 words): visit time, travel, accommodation, documents and next steps.","tips":"完成邮件后逐项核对对方问题，缺一项就不算完成任务。","mode":"书面-邮件"},{"day":18,"title":"撰写邮件②：复杂信息与校对","phase":"书面沟通","focus":"变更说明、请求确认、避免歧义","goal":"30分钟内完成一封要点齐全的正式邮件","vocab":["revision 修订","logistics 后勤安排","reimbursement 报销","approval 审批","finalize 敲定","attached 附上的"],"phrases":["Please find the revised agenda attached.","Subject to approval, …","I would appreciate your confirmation."],"listening":"Dear Program Coordinator, We have reviewed the draft agenda for the regional education workshop. The opening speech is scheduled for 9:00 a.m., but our guest speaker can only arrive at 10:00 a.m. Could you adjust the order of the sessions? We also need confirmation about the lunch arrangements for twelve visiting delegates, including two vegetarian meals. Our finance office has asked us to provide an itemized cost estimate before approving the budget. Please send the revised agenda and cost estimate by Wednesday noon so we can finalize the invitations. Kind regards, Helen Wong.","lq":{"q":"What does the finance office need?","options":["A photograph of the speaker","An itemized cost estimate","A list of library books"],"answer":1},"reading":"Editing a business email requires three passes. First, check content: have you answered every question and preserved all names, numbers, and conditions? Second, check structure and tone: do paragraphs follow a logical order, and is the request polite but clear? Third, check language: look for subject–verb agreement, articles, prepositions, punctuation, and unnecessarily long sentences. The sentence “We will finish the agenda before the Wednesday noon” contains an article problem; a natural version is “We will finish the agenda by Wednesday noon.” Read the final email once from the recipient's perspective. Could this person act on it without asking for clarification? If not, a critical detail may be missing.","rq":{"q":"Which wording is the most natural deadline?","options":["by Wednesday noon","until Wednesday noon finished","at the Wednesday noon"],"answer":0},"speak":"Explain the revised program to Helen in 60 seconds with two requested confirmations.","write":"Write a 150-word reply: reorder sessions, check meals, provide budget estimate, confirm deadline.","tips":"完成后检查时间表达及责任人是否明确；不要用不确定语气冒充确认。","mode":"书面-邮件"},{"day":19,"title":"模拟A：考前全题型串联","phase":"模拟","focus":"综合复习 + 官方机考","goal":"完成独立小测；另去官方模考做约110分钟完整测试","vocab":["mock exam 模拟考试","time management 时间管理","accuracy 准确性","completeness 完整性","review 复盘","priority 优先项"],"phrases":["Based on the results, …","My main weakness is…","I will prioritize…"],"listening":"This is a final reminder about the regional seminar. Registration opens at 8:30 a.m. on Friday, and the keynote speech begins at 9:15. The main hall seats one hundred and twenty people. We currently have one hundred and ten confirmed guests, including eight visitors who need access to the lift. The printed program will be available at the entrance. Participants who cannot attend in person may join the livestream, but they should register for a digital access link by Wednesday evening. The organizing team will test the microphones and presentation system on Thursday afternoon. Any speaker who needs technical assistance should inform the team before that test begins.","lq":{"q":"How many guests have confirmed attendance?","options":["100","110","120"],"answer":1},"reading":"Successful preparation for an integrated communication exam requires familiarity with task instructions and realistic time management. The candidate should know which tasks require short, factual answers and which require organized explanation. In oral tasks, recording may move on automatically, so the answer must be clear within the allocated time. In written tasks, a candidate should reserve time to check instructions, details, and obvious mistakes. Practice scores are useful indicators of progress, but they are not interchangeable with the testing organization's official grade. A local training platform can record self-assessment, automated quiz accuracy, and feedback from a coach. The official simulation is still necessary to experience the full computer-based testing process. After completing a mock exam, categorize errors by missing information, language accuracy, time pressure, and task misunderstanding. Then identify the two most important priorities for final revision.","rq":{"q":"What is the role of the official mock exam?","options":["It guarantees a pass","It recreates the complete test environment","It replaces all language training"],"answer":1},"speak":"Give a one-minute announcement about the regional seminar and then an evidence-based self-assessment.","write":"Write a 150-word email explaining attendance arrangements and digital registration instructions.","tips":"这是内部“模拟A精简题组”；正式长度与界面请使用官方在线模考。","mode":"模拟"},{"day":20,"title":"模拟B：最终验收与后续路线","phase":"验收","focus":"二次诊断 + 结业报告","goal":"完成新题组，对比D1与D19的能力记录并制定后续学习策略","vocab":["benchmark 基线","improvement 改善","consistent 稳定的","remaining gap 剩余差距","milestone 里程碑","next step 下一步"],"phrases":["Compared with Day 1, …","I can now…","My next learning goal is…"],"listening":"The international education office is planning a summer exchange briefing. The session will take place on 18 June from 2:00 to 4:00 p.m. Students will learn about travel documents, course selection, and campus accommodation. Three staff members will answer questions at separate information desks. The team expects about seventy participants but has reserved a room for ninety in case demand rises. Registration closes on 12 June. After the session, students will receive a link to a digital resource pack and a survey. The office will use the responses to improve future briefings. Students who cannot attend may request the slides by email, but individual visa advice will be available only through booked appointments.","lq":{"q":"When does registration close?","options":["12 June","18 June","20 June"],"answer":0},"reading":"A twenty-day intensive training program is a starting point, not proof that every skill has been permanently mastered. Meaningful progress should be evaluated with comparable tasks at the beginning and end of the program. Listening can be checked through comprehension accuracy and note quality; speaking through content coverage, clarity, fluency, and task completion; reading through the ability to identify claims and details; and writing through completeness, organization, and language control. The official examination uses its own scoring system, so a percentage from a training platform must not be presented as an official pass probability. After the final mock, a learner should identify recurring errors and schedule spaced practice. For learners who plan to use English at work, continued practice with authentic administrative tasks can help transfer examination skills to real communication. Training materials and scoring criteria should be documented so that future learners can use the same process while receiving feedback appropriate to their own level.","rq":{"q":"Which statement is accurate?","options":["An internal score guarantees an official pass","Skills need comparable baseline and final tasks","Twenty days permanently masters every skill"],"answer":1},"speak":"Record a 90-second reflection: what improved, what remains difficult, and what you will practice next.","write":"Write a 150-word email to a colleague summarizing arrangements for the June briefing.","tips":"验收需要同时保存：第二次官方模考结果、终期录音、英文邮件、四技能评分和下阶段计划。","mode":"验收"}];

let publicLoadState='not-loaded',publicLoadError='',publicLastChecked='',publicLoading=false;

let state=Object.assign({version:1,day:1,view:'dashboard',days:{},profile:{name:'',startDate:'2026-11-19',target:240,chatUrl:'https://chatgpt.com/'},recordedAt:Date.now()},loadJSON(STORAGE_KEY,{}));

let teacherDay=1,tts=null,recorder=null,stream=null,recordChunks=[],recCurrentUrl=null,timerHandle=null,timerEnds=0,timerSeconds=60;
let cloudClientId=localStorage.getItem(ETIC_OAUTH_STORAGE)||'', cloudToken=null, cloudRecords=[], cloudError='', cloudLastSync=null,cloudBusy=false,cloudClient=null;

const $=sel=>document.querySelector(sel);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const save=()=>{try{state.recordedAt=Date.now();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));return true;}catch(e){toast('本地存储写入失败，请立即导出备份。');return false;}};
const saveMaterials=()=>{try{localStorage.setItem(MATERIAL_KEY,JSON.stringify(materialOverrides));return true}catch(e){toast('教材存储失败，请先导出备份。');return false}};
const course=i=>Object.assign({},BASE_LESSONS[i-1],materialOverrides[i]||{});

const done=i=>Boolean((dayData(i).checks?.length===5&&dayData(i).checks.every(Boolean))||publicState.completed_days.includes(i));
const countDone=()=>Array.from({length:20},(_,i)=>done(i+1)).filter(Boolean).length;
const words=s=>(String(s||'').trim().match(/[A-Za-z]+(?:['’\-][A-Za-z]+)*/g)||[]).length;
function latestPublicScore(day,skill){const a=publicState.records.filter(r=>r.day===day&&r.skill===skill);return a.length?a[a.length-1].score:null}
const avgScores=()=>Object.fromEntries(SKILLKEYS.map(k=>{const byDay=new Map();for(let i=1;i<=20;i++){const a=dayData(i).scores?.[k];if(a!==null&&a!==undefined&&a!==''&&Number.isFinite(Number(a)))byDay.set(i,Number(a))}for(const r of publicState.records){if(r.skill===k)byDay.set(r.day,r.score)}const nums=[...byDay.values()];return [k,nums.length?Math.round(nums.reduce((a,b)=>a+b,0)/nums.length):null]}));

function cleanPublicProgress(doc){
  if(!doc||doc.schema_version!=='2.1'||!Array.isArray(doc.records)||!Array.isArray(doc.completed_days))throw Error('成绩数据版本不匹配或结构损坏');
  const days=[...new Set(doc.completed_days.map(Number).filter(n=>Number.isInteger(n)&&n>=1&&n<=20))].sort((a,b)=>a-b);
  const seen=new Map();
  for(const raw of doc.records.slice(0,1500)){
    const day=Number(raw.day),score=Number(raw.score),skill=String(raw.skill||'').toUpperCase(),id=String(raw.record_id||'');
    const attempt=Number(raw.attempt||1);
    if(!id||id.length>80||!Number.isInteger(day)||day<1||day>20||!['L','R','S','W'].includes(skill)||!Number.isFinite(score)||score<0||score>100||!Number.isInteger(attempt)||attempt<1||attempt>999)continue;
    seen.set(id,{record_id:id,day,skill,score,attempt});
  }
  return {schema_version:'2.1',learner_id:'learner-001',updated_at_utc:typeof doc.updated_at_utc==='string'?doc.updated_at_utc.slice(0,40):null,completed_days:days,records:[...seen.values()]};
}
async function refreshPublicProgress(silent=false){
  if(publicLoading)return;
  if(!/^https?:$/.test(location.protocol)){publicLoadState='unavailable';publicLoadError='请打开 GitHub Pages 的 HTTPS 网址以自动同步。';if(state.view==='cloud')render();return;}
  publicLoading=true;
  if(publicLoadState==='not-loaded')publicLoadState='loading';
  try{
    const url=PUBLIC_PROGRESS_PATH+'?t='+Date.now();
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok)throw Error('HTTP '+res.status);
    publicState=cleanPublicProgress(await res.json());
    publicLoadState='ok';publicLoadError='';publicLastChecked=new Date().toLocaleString('zh-CN');
    try{localStorage.setItem(PUBLIC_CACHE_KEY,JSON.stringify(publicState));}catch(_){}
    if(!silent)toast('已读取 GitHub 最新公开进度');
  }catch(e){publicLoadState='error';publicLoadError='公开成绩暂时无法读取：'+String(e&&e.message||e);}
  finally{publicLoading=false;if(state.view==='cloud'||state.view==='dashboard')render();}
}

function studioTrack(kind,track,day){
  const responses=dayData(day).studioAnswers||{};
  const panels=track.questions.map((q,i)=>{
    const key=track.id+'-'+i,prev=responses[key]||null,selected=prev?Number(prev.latestChoice):null,first=prev?prev.firstCorrect:null;
    const radioName='studio-radio-'+key;
    return `<div class="s-question" id="studio-question-${esc(key)}"><p class="s-question-title">${i+1}. ${esc(q.q)}</p><div class="s-choices">${q.options.map((option,idx)=>`<label class="s-choice"><input type="radio" name="${radioName}" value="${idx}" ${selected===idx?'checked':''}><span>${String.fromCharCode(65+idx)}. ${esc(option)}</span></label>`).join('')}</div><div class="actions"><button type="button" class="btn secondary" data-studio-answer="${esc(key)}">提交本题 ${prev?'再次练习':'答案'}</button></div><div class="s-result ${prev?(prev.latestChoice===q.answer?'correct':'wrong'):''}" id="studio-result-${esc(key)}" aria-live="polite">${prev?`首答：${first?'正确':'待改进'} · 本次：${prev.latestChoice===q.answer?'正确':'需要复习'} · ${esc(q.why)}（练习题，不等于正式技能评分）`:'提交后显示反馈；没有实际作答不计分。'}</div></div>`;
  }).join('');
  const audio=typeof track.audio==='string'&&/^\.\/assets\/audio\/[\w/-]+\.mp3$/.test(track.audio)?`<div><audio controls preload="none" src="${esc(track.audio)}"></audio><p class="helper">预录制训练音频 · 可调整播放速度（播放器支持时）</p></div>`:
  `<div class="s-audio-warning">当前尚未配置自然语音文件。可先用下方「系统语音试听」练题；它不是高质量真人音频，不能作为正式听力音质验收。</div>`;
  return `<details class="s-track" ${track===studioData(day)[kind][0]?'open':''}><summary><strong>${esc(track.name)}</strong><span class="tag">${track.time||10}分钟</span></summary><div class="s-track-content"><p class="subtitle">${esc(track.kind||track.notes||'阅读理解与信息分析')}</p>${kind==='listening'?audio+`<div class="actions"><button type="button" class="btn secondary" data-studio-play="${track.id}">▶ 系统语音试听</button><button type="button" class="btn ghost" data-action="stop-listen">停止朗读</button></div><p class="helper">${esc(track.notes)}</p><details class="s-transcript"><summary>完成听力作答后查看原文</summary><div class="passage">${nl(track.text)}</div></details>`:`<div class="passage">${nl(track.text)}</div>`}<div class="s-questions">${panels}</div></div></details>`;
}

 }).filter(Boolean);

const ETIC_CLOUD_HEADERS=['record_id','created_at_utc','day','task_id','skill','task_type','score_total','task_coverage','language_accuracy','fluency','organization','coach_summary','errors_json','next_action','evidence','record_kind','schema_version'];
const ETIC_SKILL_NAMES={L:'听力',R:'阅读',S:'口语',W:'写作'};
function cleanRecord(x){
  if(!x||typeof x!=='object'||String(x.schema_version||'')!=='2.0')return null;
  const day=Number(x.day),score=x.score_total===''?null:Number(x.score_total),skill=String(x.skill||'').toUpperCase();
  if(!Number.isInteger(day)||day<1||day>20||!ETIC_SKILL_NAMES[skill])return null;
  const kind=String(x.record_kind||'').toUpperCase();
  if(kind!=='REAL'&&kind!=='DEMO')return null;
  if(score!==null&&(!Number.isFinite(score)||score<0||score>100))return null;
  let errors=[];try{const e=JSON.parse(String(x.errors_json||'[]'));if(Array.isArray(e))errors=e.map(String).slice(0,10);}catch(_){errors=String(x.errors_json||'').trim()?[String(x.errors_json)]:[];}
  return {record_id:String(x.record_id||''),created_at_utc:String(x.created_at_utc||''),day,task_id:String(x.task_id||''),skill,task_type:String(x.task_type||''),score_total:score,task_coverage:x.task_coverage,language_accuracy:x.language_accuracy,fluency:x.fluency,organization:x.organization,coach_summary:String(x.coach_summary||''),errors,next_action:String(x.next_action||''),evidence:String(x.evidence||''),record_kind:kind,schema_version:'2.0'};
}
function parseCloudRows(rows){
  if(!Array.isArray(rows)||!rows.length)return [];
  const head=rows[0].map(s=>String(s||'').trim());
  if(!ETIC_CLOUD_HEADERS.every(k=>head.includes(k)))throw Error('表头字段与 V2 协议不一致，请勿直接修改 Scores 的列名。');
  const records=rows.slice(1).map(r=>cleanRecord(Object.fromEntries(head.map((k,i)=>[k,r?.[i]??''])))).filter(Boolean);
  const seen=new Set();return records.filter(r=>{if(!r.record_id||seen.has(r.record_id))return false;seen.add(r.record_id);return true;});
}
function realCloudRecords(){return cloudRecords.filter(r=>r.record_kind==='REAL');}
function allTrainingRecords(){const all=new Map();for(const r of manualRecords.filter(r=>r.record_kind==='REAL'))all.set(r.record_id,{...r,source:'local'});for(const r of realCloudRecords())all.set(r.record_id,{...r,source:'cloud'});return [...all.values()];}

function cloudSaveClient(){const el=$('#cloud-client-id');const t=String(el?.value||'').trim();if(t&&!/^[\w.-]+\.apps\.googleusercontent\.com$/.test(t)){cloudError='客户端 ID 格式不正确。请输入 Google Cloud Web Application OAuth Client ID。';render();return}cloudClientId=t;localStorage.setItem(ETIC_OAUTH_STORAGE,t);cloudError='';render();toast('OAuth Client ID 已保存到本浏览器');}
async function cloudConnect(){
  cloudSaveClient();if(!cloudClientId){cloudError='请先填写并保存 Google OAuth Client ID。';render();return}
  if(!window.google?.accounts?.oauth2){cloudError='Google Identity Services 尚未加载。请确认网络连接，稍后再试。';render();return}
  try{
    cloudClient=google.accounts.oauth2.initTokenClient({client_id:cloudClientId,scope:ETIC_CLOUD_SCOPE,callback:async(resp)=>{if(resp?.error||!resp?.access_token){cloudError='Google 授权失败：'+String(resp?.error||'未返回访问令牌');render();return}cloudToken=resp.access_token;cloudError='';await cloudRefresh();}});
    cloudClient.requestAccessToken({prompt:cloudToken?'':'consent'});
  }catch(e){cloudError='Google 授权未能启动：'+String(e?.message||e);render()}
}
async function cloudRefresh(){
  if(!cloudToken){cloudError='尚未授权 Google，请先点击授权读取。';render();return}
  if(cloudBusy)return;cloudBusy=true;cloudError='';if(state.view==='cloud')render();
  try{
    const range=encodeURIComponent('Scores!A1:Q1000');const url=`https://sheets.googleapis.com/v4/spreadsheets/${ETIC_CLOUD_SHEET_ID}/values/${range}?valueRenderOption=UNFORMATTED_VALUE`;
    const r=await fetch(url,{headers:{Authorization:'Bearer '+cloudToken},cache:'no-store'});
    if(!r.ok){if(r.status===401)cloudToken=null;const err=await r.json().catch(()=>({}));throw Error(`Google Sheets API ${r.status}：${String(err?.error?.message||'请检查授权、Sheets API 和表格访问权限')}`)}
    const data=await r.json();cloudRecords=parseCloudRows(data.values||[]);cloudLastSync=new Date().toLocaleString('zh-CN');toast('私有学习成绩读取成功');
  }catch(e){cloudError=String(e?.message||e)}finally{cloudBusy=false;if(state.view==='cloud')render();}
}
function cloudDisconnect(){try{if(cloudToken&&window.google?.accounts?.oauth2?.revoke)google.accounts.oauth2.revoke(cloudToken,()=>{});}catch(_){}cloudToken=null;cloudRecords=[];cloudLastSync=null;cloudError='已断开 Google 授权。';render();}
function cloudImportManual(){

  if(!obj||obj.kind!=='ETIC_SCORE_V2'||!Array.isArray(obj.rows)||!obj.rows.length||obj.rows.length>30){cloudError='缺少 kind: ETIC_SCORE_V2 或 rows 数组，或条数超过 30。';render();return}
  const rs=obj.rows.map(cleanRecord);
  if(rs.some(r=>!r||r.record_kind!=='REAL'||!r.record_id||!r.evidence)){cloudError='记录结构不完整：要求有效的 day、skill、REAL、record_id、证据和版本 2.0。';render();return}

}
function cloudApply(){

  const unique=new Map(raw.map(r=>[`${r.day}-${r.skill}`,r]));
  if(!confirm(`将 ${unique.size} 项最新云端成绩写入本浏览器的对应日课程评分栏？原分数可能被覆盖。`))return;
  for(const r of unique.values())dayData(r.day).scores[r.skill]=r.score_total;

}

function speakText(text,button,rate=0.88){
  const message=String(text||'').trim();
  if(!message)return;
  const serial=++ttsSerial;
  if(ttsWatchdog)clearTimeout(ttsWatchdog);
  ttsStartButton(button||null);
  ttsNotice('准备播放英文语音…');
  if(!('speechSynthesis' in window)||typeof window.SpeechSynthesisUtterance!=='function'){
    ttsResetButton();ttsNotice('此浏览器不支持网页语音。请用右下角指南针在 Safari 浏览器打开，并检查媒体音量。',true);return;
  }
  const synth=window.speechSynthesis;
  // iOS WebKit may silently discard a new utterance after cancel() on an idle queue.
  // Cancel only when replacing a genuinely active/queued utterance.
  try{
    if(synth.speaking||synth.pending)synth.cancel();
    const utterance=new SpeechSynthesisUtterance(message);
    utterance.lang='en-US';utterance.rate=Math.max(0.7,Math.min(1.2,Number(rate)||0.88));utterance.pitch=1;utterance.volume=1;const requestedVoice=String(document.getElementById('studioVoice')?.value||'');
    const isiOS=/iPhone|iPad|iPod/i.test(navigator.userAgent||'');
    // Prefer built-in default English voice on iOS; getVoices() may be empty on first tap.
    if(!isiOS||requestedVoice){
      const voices=synth.getVoices? synth.getVoices():[];
      const english=voices.find(v=>requestedVoice&&v.voiceURI===requestedVoice)||voices.find(v=>/^en-(US|GB|AU)/i.test(v.lang));
      if(english)utterance.voice=english;
    }
    let started=false;
    utterance.onstart=()=>{if(serial!==ttsSerial)return;started=true;ttsNotice('正在朗读。若没有声音，请检查媒体音量；应用内网页可尝试在 Safari 打开。')};
    utterance.onend=()=>{if(serial!==ttsSerial)return;clearTimeout(ttsWatchdog);ttsResetButton();ttsNotice('朗读完成。')};
    utterance.onerror=e=>{
      if(serial!==ttsSerial)return;
      clearTimeout(ttsWatchdog);ttsResetButton();
      if(e.error!=='canceled'&&e.error!=='interrupted')ttsNotice('语音播放失败（'+String(e.error||'未知原因')+'）。请用 Safari 打开网址，或检查媒体音量。',true);
    };
    tts=utterance; // Keep a strong reference to SpeechSynthesisUtterance.
    synth.speak(utterance); // Synchronous user gesture path, important on iOS.
    if(synth.paused)synth.resume();
    ttsWatchdog=setTimeout(()=>{
      if(serial!==ttsSerial||started)return;
      if(!synth.speaking)ttsResetButton();
      ttsNotice('仍未检测到语音启动。请点页面右下角指南针，用 Safari 打开网站再试；也检查媒体音量与静音状态。',true);
    },2800);
  }catch(e){
    if(serial!==ttsSerial)return;
    clearTimeout(ttsWatchdog);ttsResetButton();
    ttsNotice('当前浏览器无法启动朗读：'+String(e?.message||e)+ '。请改用 Safari 浏览器。',true);
  }
}
function stopSpeech(){
  ++ttsSerial;

  const el=$('#ttsNotice');if(el)el.hidden=true;
}

function recordDb(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(Error('IndexedDB不支持'));const r=indexedDB.open('ETIC_LAB_AUDIO_V1',1);r.onupgradeneeded=()=>r.result.createObjectStore('recordings');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}

function handleFeedback(){const raw=$('#feedbackImport')?.value||'',r=parseReport(raw),d=dayData(state.day);d.feedback=raw;if(r&&typeof r==='object'&&(!r.day||Number(r.day)===state.day)&&r.scores&&typeof r.scores==='object'){for(const k of SKILLKEYS){if(k in r.scores)d.scores[k]=normScore(r.scores[k])}d.coach={summary:String(r.summary||''),errors:Array.isArray(r.errors)?r.errors.map(String).slice(0,10):[],nextPlan:String(r.nextPlan||'')};save();render();toast('已解析并保存本日GPT评分')}else{save();toast('已保存反馈原文。未识别可解析的本日评分JSON。')}}

async function handleFile(input){const f=input.files?.[0];if(!f)return;let o;try{o=JSON.parse(await readFile(f))}catch(e){toast('无法读取JSON文件');return}if(input.id==='progressFile'){if(!validProgress(o)){toast('不是可识别的学习档案');return}if(!confirm('导入将覆盖当前浏览器的学习档案，确定继续？'))return;state=Object.assign({day:1,view:'dashboard'},o);state.day=Math.max(1,Math.min(20,Number(state.day)||1));save();render();toast('学习档案导入成功')}else{if(!o||o.kind!=='ETIC_MATERIALS_V1'||!o.lessons||typeof o.lessons!=='object'){toast('不是可识别的教材包');return}if(!confirm('导入将覆盖本浏览器的教材自定义内容，是否继续？'))return;materialOverrides={};for(let i=1;i<=20;i++){const it=o.lessons[i];if(it&&typeof it==='object'){const allowed={};for(let k of ['title','goal','focus','listening','reading','speak','write','tips'])if(typeof it[k]==='string')allowed[k]=it[k];for(let k of ['vocab','phrases'])if(Array.isArray(it[k]))allowed[k]=it[k].filter(x=>typeof x==='string').slice(0,100);for(let k of ['lq','rq'])if(it[k]&&typeof it[k].q==='string'&&Array.isArray(it[k].options)&&it[k].options.length===3&&Number.isInteger(it[k].answer)&&it[k].answer>=0&&it[k].answer<3)allowed[k]={q:it[k].q,options:it[k].options.map(String),answer:it[k].answer};materialOverrides[i]=allowed}}saveMaterials();render();toast('教材包导入成功')}}

document.addEventListener('click',e=>{
  const submit=e.target.closest('[data-studio-answer]');
  if(submit){
    const day=state.day,studio=studioData(day);if(!studio)return;
    const key=String(submit.dataset.studioAnswer||'');
    const track=[...studio.listening,...studio.reading].find(t=>key.startsWith(t.id+'-'));if(!track)return;
    const qi=Number(key.slice(track.id.length+1));if(!Number.isInteger(qi)||qi<0||qi>=track.questions.length)return;
    const question=track.questions[qi];
    const selected=document.querySelector('input[name="studio-radio-'+key+'"]:checked');
    if(!selected){toast('请选择一个答案再提交');return}
    const choice=Number(selected.value);
    if(!Number.isInteger(choice)||choice<0||choice>=question.options.length)return;
    const d=dayData(day);d.studioAnswers=d.studioAnswers||{};
    const old=d.studioAnswers[key];
    const firstChoice=old&&Number.isInteger(old.firstChoice)?old.firstChoice:choice;
    const firstCorrect=old&&typeof old.firstCorrect==='boolean'?old.firstCorrect:firstChoice===question.answer;
    d.studioAnswers[key]={firstChoice,firstCorrect,latestChoice:choice,attempts:Math.min(999,(Number(old?.attempts)||0)+1)};
    save();
    const out=document.getElementById('studio-result-'+key);
    if(out){
      out.className='s-result '+(choice===question.answer?'correct':'wrong');
      out.textContent='首答：'+(firstCorrect?'正确':'待改进')+' · 本次：'+(choice===question.answer?'正确':'需要复习')+' · '+question.why+'（练习题，不等于正式技能评分）';
    }
    submit.textContent='再次练习';
    toast('本题答案与复练次数已保存');
    return;
  }
  const play=e.target.closest('[data-studio-play]');
  if(play){
    const studio=studioData(state.day);const t=studio?.listening?.find(x=>x.id===play.dataset.studioPlay);
    if(!t)return;
    if(typeof t.audio==='string'&&t.audio){
      const audio=play.closest('.s-track')?.querySelector('audio');
      if(audio){stopSpeech();audio.play().catch(()=>toast('音频播放失败，请检查网络或文件路径。'));return;}
    }
    const rate=Number(document.getElementById('studioRate')?.value||1);
    speakText(t.text,play,rate);
    return;
  }
  const copy=e.target.closest('[data-studio-copy-speaking]');
  if(copy){
    const idx=Number(copy.dataset.studioCopySpeaking);const x=studioData(state.day);
    if(!x||!Number.isInteger(idx)||idx<0||idx>=x.speaking.length)return;
    copyText(studioCoachPrompt(state.day,idx));
    return;
  }
});

lob){const ext=currentBlob.type.includes('mp4')?'m4a':'webm';download(`ETIC_Day${String(state.day).padStart(2,'0')}_speaking.${ext}`,currentBlob)}break;case'import-feedback':handleFeedback();break;case'save-minutes':dayData(state.day).minutes=Math.max(0,Math.min(1440,parseInt($('#minutes').value)||0));save();toast('本日学习时间已保存');break;case'export-progress':jsonDownload('ETIC_20day_learning_progress.json',overallProgress());break;case'export-material':jsonDownload('ETIC_20day_curriculum_materials.json',materialExport());break;case'restore-material':if(confirm('恢复第'+teacherDay+'天的默认教材？')){delete materialOverrides[teacherDay];saveMaterials();render();toast('已恢复本日默认教材')}break;case'save-settings':{const url=$('#chatUrl').value.trim();if(url&&!/^https:\/\//i.test(url)){toast('ChatGPT网址请使用https://开头');return}state.profile={name:$('#profileName').value.trim(),startDate:$('#startDate').value,target:Math.max(30,Math.min(600,parseInt($('#targetTime').value)||240)),chatUrl:url||'https://chatgpt.com/'};save();toast('设置已保存');break}case'reset-progress':if(confirm('确定清空当前全部学习进度？此操作不会清除本地音频库或修改教材。')){state.days={};state.day=1;save();render();toast('学习进度已清空')}break;}});
